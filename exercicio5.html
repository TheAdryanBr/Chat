<meta charset="UTF-8">

<script>    

    let distanciaKM, combustivelL, CustoM;

    distanciaKM = Number(prompt("Quilômetros percorridos"));
    combustivelL = Number(prompt("Combustivel gasto"));

    CustoM = distanciaKM / combustivelL;

    document.write("O consumo médio do veículo é: ", CustoM, " km/l");

</script>
