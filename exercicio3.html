<meta charset="UTF-8">

<script>

    let nota1, nota2, nota3;

    nota1 = Number(prompt("Informe nota 1:"));
    nota2 = Number(prompt("Informe nota 2:"));
    nota3 = Number(prompt("Informe nota 3:"));

    let media = (nota1 + nota2 + nota3) / 3;

    document.write("Média final:", media);

</script>
