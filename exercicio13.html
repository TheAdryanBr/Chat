<meta charset="UTF-8">

<script>

    let idade;

    idade = Number(prompt("Informe uma idade: "));

    if (idade <= 12) {
        document.write("Criança");
    } else if (idade >= 13 && idade <= 17) { 
        document.write("Adolescente");
    } else {
        document.write("Adulto");
    }

</script>
