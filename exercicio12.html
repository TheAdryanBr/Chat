<meta charset="UTF-8">

<script>    

    let compra;

    compra = prompt ("Valor da compra:");

    let desconto = 0.10
   
    if (compra>=100) { 
        document.write("Valor original:", compra, "<br>");
        document.write("Valor do desconto: 10%", "<br>");
        document.write("Valor final:", compra - (compra * desconto), "<br>");
    } else {
        document.write("Valor original:", compra, "<br>");
        document.write("Valor do desconto: 0%", "<br>");
        document.write("Valor final:", compra);

    }


</script>
