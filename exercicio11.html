<meta charset="UTF-8">

<script>    

let num1, num2;

    num1 = prompt("Informe um número 1: ");
    num2 = prompt("Informe um número 2: ");


    if (num1 == num2){
        document.write("Os números são iguais.")

    } else {
        if (num1>num2) {
            document.write("Numero 1 é maior")
        } else {
            document.write("Numero 2 é maior")
        }

    }
</script>
