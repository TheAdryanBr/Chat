<meta charset="UTF-8">

<script>

    let nota1;

    nota1 = Number(prompt("Informe a nota: "));

    if (nota1 < 4) {
        document.write("Conceito D");
    } else if (nota1 >= 4 && nota1 < 6) { 
        document.write("Conceito C");
    } else if (nota1 >= 6 && nota1 < 8) { 
        document.write("Conceito B");
    } else {
        document.write("Conceito A");
    }

</script>
