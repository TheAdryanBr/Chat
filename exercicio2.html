<meta charset="UTF-8">

<script>

    let num1, soma, subtracao, multiplicacao, divisao;

    num1 = Number(prompt("Infornme um número: "));
    num2 = Number(prompt("Informe um número: "));

    soma = num1 + num2;
    subtracao = num1 - num2;
    multiplicacao = num1 * num2;
    divisao = num1 / num2;

    document.write("<br>", "Soma: ", soma, "<br>", "Subutração: ", subtracao, "<br>", "Multiplicação: ", multiplicacao, "<br>", "Divisão: ", divisao);


</script>
